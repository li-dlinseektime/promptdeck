<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食品 AIGC 提示词库 — PromptDeck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFFFF;
      --surface: #F7F7F5;
      --text: #37352F;
      --text-muted: #787774;
      --text-light: #9B9A97;
      --border: rgba(55, 53, 47, 0.09);
      --border-strong: rgba(55, 53, 47, 0.16);
      --divider: rgba(55, 53, 47, 0.12);
      --shadow-subtle: 0 1px 3px rgba(15, 15, 15, 0.04), 0 2px 8px rgba(15, 15, 15, 0.03);
      --radius: 8px;
      --radius-sm: 4px;
      --accent: #2383E2;
      --accent-bg: rgba(35, 131, 226, 0.10);
      --accent-text: #1a6fc4;
      --success: #448361;
      --tag-bg: rgba(55, 53, 47, 0.06);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    body {
      overflow-y: auto;
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 40px 80px;
    }

    /* —— Header —— */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--divider);
    }

    .header-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }

    .header-back:hover {
      background: var(--tag-bg);
      color: var(--text);
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.25;
      color: var(--text);
    }

    .header-title .sub {
      display: block;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* —— Section —— */
    .section {
      margin-bottom: 32px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* —— Info Note —— */
    .info-note {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
      padding: 12px 16px;
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 24px;
    }

    /* —— Template Cards —— */
    .template-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .template-card {
      flex: 1;
      min-width: 200px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      user-select: none;
      position: relative;
    }

    .template-card:hover {
      background: rgba(55, 53, 47, 0.04);
      border-color: var(--border-strong);
    }

    .template-card:active {
      transform: scale(0.98);
    }

    .template-card .tpl-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .template-card .tpl-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .template-card .tpl-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: var(--tag-bg);
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
    }

    .template-card:hover .tpl-badge {
      background: var(--accent-bg);
      color: var(--accent-text);
    }

    .template-card .tpl-active {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: var(--accent-bg);
      color: var(--accent-text);
    }

    .template-card.is-active {
      border-color: rgba(35, 131, 226, 0.20);
      background: rgba(35, 131, 226, 0.04);
    }

    .template-card.is-active .tpl-active {
      display: inline-block;
    }

    .template-card.is-active .tpl-badge {
      background: var(--tag-bg);
      color: var(--text-muted);
    }

    /* —— Config Panel —— */
    .config-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 8px;
    }

    .config-group {
      margin-bottom: 16px;
    }

    .config-group-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .config-group-label .group-num {
      font-weight: 500;
      color: var(--text-light);
    }

    .config-group-label .group-hint {
      font-weight: 400;
      color: var(--text-light);
      font-size: 0.68rem;
    }

    /* —— Chip Selector —— */
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .chip:hover {
      background: var(--accent-bg);
      border-color: rgba(35, 131, 226, 0.18);
    }

    .chip.selected {
      background: var(--accent-bg);
      border-color: rgba(35, 131, 226, 0.25);
      color: var(--accent-text);
      font-weight: 500;
    }

    .chip .chip-emoji {
      font-size: 1rem;
      line-height: 1;
    }

    .chip .chip-check {
      display: none;
      font-size: 0.65rem;
      color: var(--accent);
      font-weight: 700;
    }

    .chip.selected .chip-check {
      display: inline;
    }

    /* —— Module Preview —— */
    .module-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .module-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.12s;
    }

    .module-card:hover {
      border-color: var(--border-strong);
    }

    .module-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .module-card-header:hover {
      background: rgba(55, 53, 47, 0.03);
    }

    .module-card-header .mc-toggle {
      font-size: 0.6rem;
      color: var(--text-light);
      transition: transform 0.15s;
      flex-shrink: 0;
      width: 14px;
      text-align: center;
    }

    .module-card-header.open .mc-toggle {
      transform: rotate(90deg);
    }

    .module-card-header .mc-label {
      flex: 1;
    }

    .module-card-header .mc-tag {
      font-size: 0.62rem;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: var(--radius-sm);
      background: var(--tag-bg);
      color: var(--text-muted);
    }

    .module-card-body {
      padding: 0 14px 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.7;
      white-space: pre-wrap;
      background: var(--bg);
    }

    .module-card-body.collapsed {
      display: none;
    }

    /* —— Preview Area —— */
    .preview-area {
      margin-top: 4px;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .preview-toolbar .char-count {
      font-size: 0.72rem;
      color: var(--text-light);
      margin-right: auto;
    }

    .preview-toolbar .toolbar-btn {
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    .preview-toolbar .toolbar-btn:hover {
      background: var(--tag-bg);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .preview-toolbar .toolbar-btn.primary {
      color: var(--accent-text);
      border-color: rgba(35, 131, 226, 0.20);
    }

    .preview-toolbar .toolbar-btn.primary:hover {
      background: var(--accent-bg);
      border-color: rgba(35, 131, 226, 0.30);
    }

    .preview-toolbar .toolbar-btn.primary.copied {
      color: var(--success);
      border-color: rgba(68, 131, 97, 0.25);
      background: rgba(68, 131, 97, 0.08);
    }

    .preview-box {
      width: 100%;
      min-height: 160px;
      max-height: 340px;
      resize: vertical;
      font-family: "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
      font-size: 0.82rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      outline: none;
      line-height: 1.65;
      white-space: pre-wrap;
      transition: border-color 0.12s;
    }

    .preview-box:focus {
      border-color: rgba(35, 131, 226, 0.20);
    }

    .preview-box::placeholder {
      color: var(--text-muted);
    }

    /* —— Toast —— */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 8px 18px;
      border-radius: var(--radius);
      font-size: 0.82rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* —— Responsive —— */
    @media (max-width: 720px) {
      .app {
        padding: 24px 20px 64px;
      }
      .header {
        flex-wrap: wrap;
      }
      .template-grid {
        flex-direction: column;
      }
      .template-card {
        min-width: unset;
      }
      .config-panel {
        padding: 16px 14px 4px;
      }
      .preview-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .preview-toolbar .char-count {
        margin-right: 0;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <a class="header-back" href="../index.html">← 返回</a>
      <div class="header-title">
        <h1>🍽️ 食品 AIGC 提示词库</h1>
        <span class="sub">模块化提示词工作台</span>
      </div>
    </div>

    <!-- Info Note -->
    <div class="info-note">
      将食品图像生成 prompt 拆分为产品、场景、包装、配菜和负向约束模块，便于快速复用与迭代。
    </div>

    <!-- Quick Templates -->
    <div class="section">
      <div class="section-label">⚡ 常用模板</div>
      <div class="template-grid" id="template-grid"></div>
    </div>

    <!-- Config Panel -->
    <div class="section">
      <div class="config-panel">
        <div class="config-group">
          <div class="config-group-label">
            <span class="group-num">①</span> 选择产品
          </div>
          <div class="chip-grid" id="product-selector"></div>
        </div>

        <div class="config-group">
          <div class="config-group-label">
            <span class="group-num">②</span> 选择场景
          </div>
          <div class="chip-grid" id="scene-selector"></div>
        </div>

        <div class="config-group">
          <div class="config-group-label">
            <span class="group-num">③</span> 包装类型
            <span class="group-hint">可多选</span>
          </div>
          <div class="chip-grid" id="packaging-selector"></div>
        </div>

        <div class="config-group">
          <div class="config-group-label">
            <span class="group-num">④</span> 配菜策略
            <span class="group-hint">可多选</span>
          </div>
          <div class="chip-grid" id="sides-selector"></div>
        </div>
      </div>
    </div>

    <!-- Module Preview -->
    <div class="section">
      <div class="section-label">⑤ 模块预览</div>
      <div class="module-grid" id="module-grid"></div>
    </div>

    <!-- Final Prompt Preview -->
    <div class="section preview-area">
      <div class="section-label">⑥ 最终 Prompt</div>
      <div class="preview-toolbar">
        <span class="char-count" id="char-count">0 字符</span>
        <button type="button" class="toolbar-btn primary" id="btn-copy">📋 复制</button>
        <button type="button" class="toolbar-btn" id="btn-reset">重置默认</button>
      </div>
      <textarea class="preview-box" id="prompt-preview" placeholder="选择产品与场景后，此处将自动生成组装好的 prompt…" readonly></textarea>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ============================================================
    // 1. 模块库
    // ============================================================
    const FOOD_MODULES = {
      // 0. 通用真实生活感底色层
      globalBase: {
        realism: "真实中国年轻家庭日常场景，使用 iPhone 随手拍摄。画面应像真实家长在做饭或吃饭过程中顺手记录，而不是专业摄影、商业美食图或电商主图。环境干净整洁但有轻微生活痕迹，不是样板间。使用真实家庭自然光或室内暖光，光线不均匀，有方向性，带有轻微手机 HDR 感。构图自然，不追求居中、对称或精致摆拍。3:4 竖版。不要文字、水印、logo、界面元素。"
      },

      // 1. 四类场景骨架
      scenes: {
        kitchenCooking: {
          name: "厨房煎制图",
          desc: "画面主体正在普通家用平底锅中煎制，锅放在日常使用的燃气灶或电磁炉上。一个家长一只手自然拿着夹子，正在翻动或检查熟度，动作发生在真实做饭过程中，不是摆拍。背景为普通中国家庭厨房，浅色台面、常见瓷砖墙面、普通锅具和厨房用品自然存在。整体像做饭途中顺手拍下的一张生活照片。"
        },
        rawPrep: {
          name: "生鲜备菜图",
          desc: "使用参考图中的厨房环境，生成一张看起来像同一个家长在同一次做饭过程中、使用同一部 iPhone 拍摄的照片。画面主体是未烹饪的生鲜主菜，放在普通家用陶瓷盘、砧板或厨房台面上。旁边自然出现少量备料元素，例如夹子、厨房纸、盐、黑胡椒、刀具或砧板中的 1–2 种。整体像准备下锅前顺手拍下的真实备菜状态，而不是商品展示图。"
        },
        tableFinished: {
          name: "餐桌成品图",
          desc: "画面主体是一份已经煎制完成的家常健康餐，放在普通家用餐盘中，准备开吃前顺手拍下。餐具和桌面应是普通中国家庭常见风格，环境干净整洁，有轻微生活痕迹但不杂乱。画面像家长准备吃饭前拍给小红书分享的真实生活照片，不像西餐厅摆盘，也不像商业宣传图。"
        },
        cutOrPickup: {
          name: "截面/夹起细节图",
          desc: "使用参考图中的餐桌环境，生成一张看起来像同一个家长在同一顿家庭晚餐过程中、使用同一部 iPhone 拍摄的照片。画面主体是已经煎好的主菜被筷子、叉子或餐具轻轻夹起一小块，或者被自然切开，露出内部真实纹理。构图可以比成品图稍微靠近主体，但仍然保留真实手机随手拍感，不要变成商业微距摄影。"
        }
      },

      // 2. 产品主体识别层 + 产品专属负向约束
      products: {
        steak: {
          name: "牛排",
          emoji: "🥩",
          identity: "牛排应呈现为中国年轻家庭日常会购买的普通厚度家常牛排，厚度适中偏薄，不是 steakhouse 风格的厚切牛排，也不要显得过大过厚。表面应呈现自然煎痕和轻微出汁，烹饪方式偏少油、清爽，不使用厚重酱汁，不表现重油、重口或油腻感。整体气质是高蛋白、少油、清爽、营养均衡的家庭健康餐。",
          negatives: "不要厚切牛排，不要 steakhouse 风格，不要西餐厅精致牛排摆盘，不要过大过厚，不要强烈黄油煎封感。"
        },
        chicken: {
          name: "鸡排",
          emoji: "🍗",
          identity: "鸡排应呈现为中国年轻家庭日常会购买的普通家常鸡排，大小适中，厚度适中偏薄，像日常家庭做健康餐时会使用的鸡排。应表现真实鸡肉质感，表面有自然鸡肉纹理和轻微煎痕。烹饪后呈浅金黄到淡金棕色的家常煎制状态，不是油炸感、裹粉感、重油感或快餐感。",
          negatives: "不要炸鸡排，不要鸡柳，不要鸡米花，不要裹粉炸物，不要快餐感，不要牛排、鱼排或西餐厅精致鸡排摆盘。"
        },
        fish: {
          name: "鱼排",
          emoji: "🐟",
          identity: "鱼排应保持为一整块家常巴沙鱼排的外观特征。煎制时表面有轻微金黄煎痕和自然鱼肉质感，整体清爽低脂，不做成裹粉油炸或深油炸效果。生鲜状态下应呈现自然浅色鱼肉质感，不要像鸡胸肉、牛排或炸鱼排。截面应表现柔嫩、洁白、真实的鱼肉纹理。",
          negatives: "不要炸鱼块，不要鱼柳条，不要鸡排，不要牛排，不要鸡胸肉，不要裹粉油炸鱼排，不要西餐厅精致鱼排摆盘。"
        }
      },

      // 3. 产品 × 场景特化层
      productSceneOverrides: {
        steak: {
          kitchenCooking: "画面主体是一块家常牛排正在普通家用平底锅中煎制。牛排表面开始自然上色，边缘微微焦香，锅中只有少量薄薄的油膜。牛排表面应是自然轻微出汁和清爽煎痕，而不是油亮、厚重油润或浸在油里的状态。",

    const $ = (sel) => document.querySelector(sel);

    // ============================================================
    // 5. 工具函数
    // ============================================================
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function updateCharCount(text) {
      const len = text.length;
      charCount.textContent = `${len} 字符`;
    }

    // ============================================================
    // 6. 渲染模板卡片
    // ============================================================
    function renderTemplateCards() {
      const activeTpl = findMatchingTemplate();

      templateGrid.innerHTML = FOOD_TEMPLATES.map(t => {
        const isActive = activeTpl && activeTpl.id === t.id;
        return `<div class="template-card ${isActive ? "is-active" : ""}" data-template="${t.id}">
          <div class="tpl-name">${escapeHtml(t.name)}</div>
          <div class="tpl-desc">${escapeHtml(t.desc)}</div>
          <span class="tpl-badge">${isActive ? "已应用" : "一键应用"}</span>
          <span class="tpl-active">当前模板</span>
        </div>`;
      }).join("");

      templateGrid.querySelectorAll("[data-template]").forEach((card) => {
        card.addEventListener("click", () => {
          const id = card.getAttribute("data-template");
          const tpl = FOOD_TEMPLATES.find(t => t.id === id);
          if (!tpl) return;
          applyTemplate(tpl);
        });
      });
    }

    function applyTemplate(tpl) {
      state.product = tpl.product;
      state.scene = tpl.scene;
      state.sideDish = tpl.sideDish;
      state.packaging = new Set(tpl.packaging);

      renderProductSelector();
      renderSceneSelector();
      renderPackagingSelector();
      renderSidesSelector();
      renderTemplateCards();
      onSelectionChange();
      showToast(`已应用模板：${tpl.name}`);
    }


    // ============================================================
    // 7. 渲染选择器
    // ============================================================
    function renderProductSelector() {
      const products = FOOD_MODULES.products;
      productSelector.innerHTML = Object.entries(products).map(([id, p]) =>
        `<button type="button" class="chip ${state.product === id ? "selected" : ""}" data-product="${id}">
          <span class="chip-check">✓</span>
          <span class="chip-emoji">${p.emoji}</span>
          ${escapeHtml(p.name)}
        </button>`
      ).join("");

      productSelector.querySelectorAll("[data-product]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-product");
          state.product = state.product === id ? null : id;
          renderProductSelector();
          renderTemplateCards();
          onSelectionChange();
        });
      });
    }

    function renderSceneSelector() {
      const scenes = FOOD_MODULES.scenes;
      sceneSelector.innerHTML = Object.entries(scenes).map(([id, s]) =>
        `<button type="button" class="chip ${state.scene === id ? "selected" : ""}" data-scene="${id}">
          <span class="chip-check">✓</span>
          ${escapeHtml(s.name)}
        </button>`
      ).join("");

      sceneSelector.querySelectorAll("[data-scene]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-scene");
          state.scene = state.scene === id ? null : id;
          renderSceneSelector();
          renderTemplateCards();
          onSelectionChange();
        });
      });
    }

    function renderPackagingSelector() {
      const items = FOOD_MODULES.packagingStrategies;
      packagingSelector.innerHTML = Object.entries(items).map(([id, p]) =>
        `<button type="button" class="chip multi ${state.packaging.has(id) ? "selected" : ""}" data-packaging="${id}">
          <span class="chip-check">✓</span>
          ${escapeHtml(p.name)}
        </button>`
      ).join("");

      packagingSelector.querySelectorAll("[data-packaging]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-packaging");
          if (state.packaging.has(id)) {
            state.packaging.delete(id);
          } else {
            state.packaging.add(id);
          }
          renderPackagingSelector();
          renderTemplateCards();
          onSelectionChange();
        });
      });
    }

    function renderSidesSelector() {
      const items = FOOD_MODULES.sideDishStrategies;
      sidesSelector.innerHTML = Object.entries(items).map(([id, s]) =>
        `<button type="button" class="chip multi ${state.sideDish === id ? "selected" : ""}" data-sides="${id}">

          ${escapeHtml(s.name)}

      ).join("");

    // ============================================================
    // 8. 匹配模板 & 组装 prompt
    // ============================================================
    function findMatchingTemplate() {
      if (!state.product || !state.scene) return null;
      let match = FOOD_TEMPLATES.find(t => t.product === state.product && t.scene === state.scene);
      if (match) return match;
      match = FOOD_TEMPLATES.find(t => t.product === state.product);
      return match || null;
    }

    function getLayerTexts() {
      if (!state.product || !state.scene) return null;

      const prod = FOOD_MODULES.products[state.product];
      const scn = FOOD_MODULES.scenes[state.scene];
      const override = FOOD_MODULES.productSceneOverrides[state.product][state.scene];
      const sideDishText = state.sideDish
        ? FOOD_MODULES.sideDishStrategies[state.sideDish].desc
        : "（未选择配菜策略）";
      const productSideDishText = FOOD_MODULES.productSideDishes[state.product];

      // 包装层：排除 "none" 后，如果有包装策略则组装
      const hasPackaging = state.packaging.size > 0 && !(state.packaging.size === 1 && state.packaging.has("none"));
      let packagingTexts = [];
      if (hasPackaging) {
        state.packaging.forEach(id => {
          if (id !== "none" && FOOD_MODULES.packagingStrategies[id]) {
            packagingTexts.push(FOOD_MODULES.packagingStrategies[id].desc);
          }
        });
      }
      const packagingText = packagingTexts.length > 0
        ? packagingTexts.join("；")
        : "不出现产品包装。画面只保留真实家庭厨房或餐桌场景、主菜、配菜和少量日常用品。";

      // 负向约束组装
      const neg = FOOD_MODULES.negativeConstraints;
      let negativeParts = [neg.global, neg.oilControl, prod.negatives];
      if (hasPackaging) {
        negativeParts.push(neg.packaging);
      }
      const negativeText = negativeParts.join("\n");

      const layers = [];

      layers.push({ name: "真实生活感底色层", text: FOOD_MODULES.globalBase.realism, tag: "通用" });
      layers.push({ name: "场景层", text: scn.desc, tag: "场景" });
      layers.push({ name: "产品主体识别层", text: prod.identity, tag: "产品" });
      layers.push({ name: "产品×场景特化层", text: override, tag: "产品" });
      layers.push({ name: "配菜策略层", text: sideDishText, tag: "配菜" });
      layers.push({ name: "产品专属辅料层", text: productSideDishText, tag: "配菜" });
      layers.push({ name: "包装植入层", text: packagingText, tag: "包装" });
      layers.push({ name: "负向约束层", text: negativeText, tag: "通用" });

      return layers;
    }


    function assemblePrompt() {
      const layers = getLayerTexts();

      if (!layers) {
        promptPreview.value = "";
        updateCharCount("");
        renderModuleCards(null);
        return;
      }

      const fullPrompt = layers.map(l => l.text).filter(t => t).join("\n\n");
      promptPreview.value = fullPrompt;
      updateCharCount(fullPrompt);

      renderModuleCards(layers);
    }

    // ============================================================
    // 9. 渲染模块预览卡片
    // ============================================================
    function renderModuleCards(layers) {
      if (!layers || layers.length === 0) {
        moduleGrid.innerHTML = `<div class="empty-state" style="text-align:center;padding:32px 16px;color:var(--text-muted);background:var(--surface);border-radius:var(--radius);font-size:0.88rem;">选择产品和场景后，此处将展示各层模块内容</div>`;
        return;
      }

      moduleGrid.innerHTML = layers.map((layer, i) =>
        `<div class="module-card">
          <div class="module-card-header open" data-mc-index="${i}">
            <span class="mc-toggle">▶</span>
            <span class="mc-label">${escapeHtml(layer.name)}</span>
            <span class="mc-tag">${layer.tag || ""}</span>
          </div>
          <div class="module-card-body">${escapeHtml(layer.text)}</div>
        </div>`
      ).join("");

      moduleGrid.querySelectorAll("[data-mc-index]").forEach((header) => {
        header.addEventListener("click", () => {
          const idx = header.getAttribute("data-mc-index");
          const body = moduleGrid.querySelectorAll(".module-card-body")[idx];
          const isOpen = header.classList.toggle("open");
          body.classList.toggle("collapsed");
        });
      });
    }

    // ============================================================
    // 10. 选择变更回调
    // ============================================================
    function onSelectionChange() {
      assemblePrompt();
    }

    // ============================================================
    // 11. 复制功能
    // ============================================================
    async function copyPrompt() {
      const text = promptPreview.value.trim();
      if (!text) {
        showToast("请先选择产品和场景生成 prompt");
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      btnCopy.textContent = "✅ 已复制";
      btnCopy.classList.add("copied");
      setTimeout(() => {
        btnCopy.textContent = "📋 复制";
        btnCopy.classList.remove("copied");
      }, 1500);
      showToast("已复制到剪贴板");
    }

    // ============================================================
    // 12. 重置为默认
    // ============================================================
    function resetToDefault() {
      state.product = DEFAULT_STATE.product;
      state.scene = DEFAULT_STATE.scene;
      state.sideDish = DEFAULT_STATE.sideDish;
      state.packaging = new Set(DEFAULT_STATE.packaging);

      renderProductSelector();
      renderSceneSelector();
      renderPackagingSelector();
      renderSidesSelector();
      renderTemplateCards();
      onSelectionChange();
      showToast("已重置为默认配置（牛排 · 厨房煎制）");
    }


    // ============================================================
    // 13. 初始化
    // ============================================================
    function init() {
      renderTemplateCards();
      renderProductSelector();
      renderSceneSelector();
      renderPackagingSelector();
      renderSidesSelector();

      // 立即生成默认 prompt
      assemblePrompt();

      btnCopy.addEventListener("click", copyPrompt);
      btnReset.addEventListener("click", resetToDefault);
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Prompt Library — PromptDeck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFFFF;
      --surface: #F7F7F5;
      --text: #37352F;
      --text-muted: #787774;
      --text-light: #9B9A97;
      --border: rgba(55, 53, 47, 0.09);
      --border-strong: rgba(55, 53, 47, 0.16);
      --divider: rgba(55, 53, 47, 0.12);
      --shadow-subtle: 0 1px 3px rgba(15, 15, 15, 0.04), 0 2px 8px rgba(15, 15, 15, 0.03);
      --radius: 8px;
      --radius-sm: 4px;
      --accent: #2383E2;
      --accent-bg: rgba(35, 131, 226, 0.10);
      --accent-text: #1a6fc4;
      --success: #448361;
      --tag-bg: rgba(55, 53, 47, 0.06);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    body {
      overflow-y: auto;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 32px 64px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--divider);
    }

    .header-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }

    .header-back:hover {
      background: var(--tag-bg);
      color: var(--text);
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.25;
      color: var(--text);
    }

    .info-note {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
      padding: 12px 16px;
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 24px;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 28px;
      align-items: start;
    }

    .left-panel {
      position: sticky;
      top: 24px;
    }

    .right-panel {
      min-width: 0;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .suite-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suite-card {
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      user-select: none;
      position: relative;
    }

    .suite-card:hover {
      background: rgba(55, 53, 47, 0.04);
      border-color: var(--border-strong);
    }

    .suite-card:active {
      transform: scale(0.98);
    }

    .suite-card.is-active {
      border-color: rgba(35, 131, 226, 0.20);
      background: rgba(35, 131, 226, 0.04);
    }

    .suite-card .suite-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .suite-card .suite-scenes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .suite-card .suite-scene-chip {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: var(--tag-bg);
      color: var(--text-muted);
    }

    .suite-card .suite-active-badge {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: var(--accent-bg);
      color: var(--accent-text);
    }

    .suite-card.is-active .suite-active-badge {
      display: inline-block;
    }

    .config-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 16px 4px;
    }

    .config-group {
      margin-bottom: 14px;
    }

    .config-group-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .config-group-label .group-hint {
      font-weight: 400;
      color: var(--text-light);
      font-size: 0.68rem;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .chip:hover {
      background: var(--accent-bg);
      border-color: rgba(35, 131, 226, 0.18);
    }

    .chip.selected {
      background: var(--accent-bg);
      border-color: rgba(35, 131, 226, 0.25);
      color: var(--accent-text);
      font-weight: 500;
    }

    .chip .chip-check {
      display: none;
      font-size: 0.65rem;
      color: var(--accent);
      font-weight: 700;
    }

    .chip.selected .chip-check {
      display: inline;
    }

    .packaging-hint {
      font-size: 0.72rem;
      color: #b8860b;
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(184, 134, 11, 0.06);
      border-radius: var(--radius-sm);
      display: none;
    }

    .packaging-hint.visible {
      display: block;
    }

    .composition-summary {
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 10px 14px;
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .composition-summary strong {
      color: var(--text);
      font-weight: 600;
    }

    .module-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 20px;
    }

    .module-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.12s;
    }

    .module-card:hover {
      border-color: var(--border-strong);
    }

    .module-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .module-card-header:hover {
      background: rgba(55, 53, 47, 0.03);
    }

    .module-card-header .mc-toggle {
      font-size: 0.55rem;
      color: var(--text-light);
      transition: transform 0.15s;
      flex-shrink: 0;
      width: 12px;
      text-align: center;
    }

    .module-card-header.open .mc-toggle {
      transform: rotate(90deg);
    }

    .module-card-header .mc-label {
      flex: 1;
    }

    .module-card-header .mc-tag {
      font-size: 0.6rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--tag-bg);
      color: var(--text-muted);
    }

    .module-card-body {
      padding: 0 12px 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.65;
      white-space: pre-wrap;
      background: var(--bg);
    }

    .module-card-body.collapsed {
      display: none;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .preview-toolbar .char-count {
      font-size: 0.72rem;
      color: var(--text-light);
      margin-right: auto;
    }

    .preview-toolbar .toolbar-btn {
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    .preview-toolbar .toolbar-btn:hover {
      background: var(--tag-bg);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .preview-toolbar .toolbar-btn.primary {
      color: var(--accent-text);
      border-color: rgba(35, 131, 226, 0.20);
    }

    .preview-toolbar .toolbar-btn.primary:hover {
      background: var(--accent-bg);
      border-color: rgba(35, 131, 226, 0.30);
    }

    .preview-toolbar .toolbar-btn.primary.copied {
      color: var(--success);
      border-color: rgba(68, 131, 97, 0.25);
      background: rgba(68, 131, 97, 0.08);
    }

    .preview-box {
      width: 100%;
      min-height: 140px;
      max-height: 300px;
      resize: vertical;
      font-family: "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
      font-size: 0.8rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      outline: none;
      line-height: 1.6;
      white-space: pre-wrap;
      transition: border-color 0.12s;
    }

    .preview-box:focus {
      border-color: rgba(35, 131, 226, 0.20);
    }

    .preview-box::placeholder {
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 8px 18px;
      border-radius: var(--radius);
      font-size: 0.82rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
      .left-panel {
        position: static;
      }
      .app {
        padding: 24px 20px 48px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <a class="header-back" href="../index.html">← Back</a>
      <div class="header-title">
        <h1>Food Prompt Library</h1>
      </div>
    </div>

    <div class="info-note">
      Modular prompt system for food image generation.
    </div>

    <div class="workspace-grid">
      <div class="left-panel">
        <div class="section">
          <div class="section-label">产品套组</div>
          <div class="suite-grid" id="suite-grid"></div>
        </div>

        <div class="section">
          <div class="config-panel">
            <div class="config-group">
              <div class="config-group-label">当前场景</div>
              <div class="chip-grid" id="scene-selector"></div>
            </div>

            <div class="config-group">
              <div class="config-group-label">
                包装类型
                <span class="group-hint">可多选</span>
              </div>
              <div class="chip-grid" id="packaging-selector"></div>
              <div class="packaging-hint" id="packaging-hint">鱼排包装尚未充分测试，建议使用无包装配置。</div>
            </div>

            <div class="config-group">
              <div class="config-group-label">配菜策略</div>
              <div class="chip-grid" id="sides-selector"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="composition-summary" id="composition-summary"></div>

        <div class="section">
          <div class="section-label">模块预览</div>
          <div class="module-grid" id="module-grid"></div>
        </div>

        <div class="section">
          <div class="section-label">最终 Prompt</div>
          <div class="preview-toolbar">
            <span class="char-count" id="char-count">0 字符</span>
            <button type="button" class="toolbar-btn primary" id="btn-copy">复制</button>
            <button type="button" class="toolbar-btn" id="btn-reset">重置默认</button>
          </div>
          <textarea class="preview-box" id="prompt-preview" placeholder="选择产品套组和场景后自动生成。" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const FOOD_MODULES = {
      globalBase: {
        realism: "真实中国年轻家庭日常场景，使用 iPhone 随手拍摄。画面应像真实家长在做饭或吃饭过程中顺手记录，而不是专业摄影、商业美食图或电商主图。环境干净整洁但有轻微生活痕迹，不是样板间。使用真实家庭自然光或室内暖光，光线不均匀，有方向性，带有轻微手机 HDR 感。构图自然，不追求居中、对称或精致摆拍。3:4 竖版。不要文字、水印、logo、界面元素。"
      },
      scenes: {
        kitchenCooking: { name: "厨房煎制图", desc: "画面主体正在普通家用平底锅中煎制，锅放在日常使用的燃气灶或电磁炉上。一个家长一只手自然拿着夹子，正在翻动或检查熟度，动作发生在真实做饭过程中，不是摆拍。背景为普通中国家庭厨房，浅色台面、常见瓷砖墙面、普通锅具和厨房用品自然存在。整体像做饭途中顺手拍下的一张生活照片。" },
        rawPrep: { name: "生鲜备菜图", desc: "使用参考图中的厨房环境，生成一张看起来像同一个家长在同一次做饭过程中、使用同一部 iPhone 拍摄的照片。画面主体是未烹饪的生鲜主菜，放在普通家用陶瓷盘、砧板或厨房台面上。旁边自然出现少量备料元素，例如夹子、厨房纸、盐、黑胡椒、刀具或砧板中的 1–2 种。整体像准备下锅前顺手拍下的真实备菜状态，而不是商品展示图。" },
        tableFinished: { name: "餐桌成品图", desc: "画面主体是一份已经煎制完成的家常健康餐，放在普通家用餐盘中，准备开吃前顺手拍下。餐具和桌面应是普通中国家庭常见风格，环境干净整洁，有轻微生活痕迹但不杂乱。画面像家长准备吃饭前拍给小红书分享的真实生活照片，不像西餐厅摆盘，也不像商业宣传图。" },
        cutOrPickup: { name: "截面/夹起细节图", desc: "使用参考图中的餐桌环境，生成一张看起来像同一个家长在同一顿家庭晚餐过程中、使用同一部 iPhone 拍摄的照片。画面主体是已经煎好的主菜被筷子、叉子或餐具轻轻夹起一小块，或者被自然切开，露出内部真实纹理。构图可以比成品图稍微靠近主体，但仍然保留真实手机随手拍感，不要变成商业微距摄影。" }
      },
      products: {
        steak: { name: "牛排", emoji: "🥩", identity: "牛排应呈现为中国年轻家庭日常会购买的普通厚度家常牛排，厚度适中偏薄，不是 steakhouse 风格的厚切牛排，也不要显得过大过厚。表面应呈现自然煎痕和轻微出汁，烹饪方式偏少油、清爽，不使用厚重酱汁，不表现重油、重口或油腻感。整体气质是高蛋白、少油、清爽、营养均衡的家庭健康餐。", negatives: "不要厚切牛排，不要 steakhouse 风格，不要西餐厅精致牛排摆盘，不要过大过厚，不要强烈黄油煎封感。" },
        chicken: { name: "鸡排", emoji: "🍗", identity: "鸡排应呈现为中国年轻家庭日常会购买的普通家常鸡排，大小适中，厚度适中偏薄，像日常家庭做健康餐时会使用的鸡排。应表现真实鸡肉质感，表面有自然鸡肉纹理和轻微煎痕。烹饪后呈浅金黄到淡金棕色的家常煎制状态，不是油炸感、裹粉感、重油感或快餐感。", negatives: "不要炸鸡排，不要鸡柳，不要鸡米花，不要裹粉炸物，不要快餐感，不要牛排、鱼排或西餐厅精致鸡排摆盘。" },
        fish: { name: "鱼排", emoji: "🐟", identity: "鱼排应保持为一整块家常巴沙鱼排的外观特征。煎制时表面有轻微金黄煎痕和自然鱼肉质感，整体清爽低脂，不做成裹粉油炸或深油炸效果。生鲜状态下应呈现自然浅色鱼肉质感，不要像鸡胸肉、牛排或炸鱼排。截面应表现柔嫩、洁白、真实的鱼肉纹理。", negatives: "不要炸鱼块，不要鱼柳条，不要鸡排，不要牛排，不要鸡胸肉，不要裹粉油炸鱼排，不要西餐厅精致鱼排摆盘。" }
      },
      productSceneOverrides: {
        steak: {
          kitchenCooking: "画面主体是一块家常牛排正在普通家用平底锅中煎制。牛排表面开始自然上色，边缘微微焦香，锅中只有少量薄薄的油膜。牛排表面应是自然轻微出汁和清爽煎痕，而不是油亮、厚重油润或浸在油里的状态。",
          rawPrep: "画面主体是一块未烹饪的生牛排，放在普通家用陶瓷盘、砧板或厨房台面上。牛排表面质感清晰，呈现真实自然的新鲜生肉纹理和色泽。牛排厚度适中偏薄，不是厚切牛排。整体像准备下锅前顺手拍下的真实备菜状态。",
          tableFinished: "画面主体是一份已经煎制完成的家常牛排晚餐，放在普通家用餐盘中。牛排应真实好吃、家常自然，不像西餐厅摆盘，也不像商业宣传图。整体不使用厚重酱汁，不要重油感，呈现健康家常餐的真实分享感。",
          cutOrPickup: "画面主体是一块已经切开的牛排，露出真实自然的内部纹理和熟度状态。刀或叉刚刚切开牛排，或者一小块牛排被轻微分离，呈现正在吃饭过程中的自然瞬间。不要拍成专业食物特写。"
        },
        chicken: {
          kitchenCooking: "画面主体是一块家常鸡排正在普通家用平底锅中煎制。鸡排表面开始自然上色，边缘微微金黄，带有轻微焦香感。鸡排应表现真实鸡肉质感，表面自然轻微出汁和轻微煎痕，不要做成裹粉油炸或深油炸效果。",
          rawPrep: "画面主体是一整块未烹饪的生鸡排，放在普通家用陶瓷盘、砧板或厨房台面上。鸡排表面质感清晰，呈现真实自然的新鲜鸡肉纹理和色泽，颜色为自然浅粉色或浅肉色鸡肉质感，不要像鱼排、牛排或炸鸡排。",
          tableFinished: "画面主体是一份已经煎制完成的家常鸡排健康餐，放在普通家用餐盘中。鸡排表面有轻微金黄煎痕和自然鸡肉质感，分量合理，适宜 1–2 人食。不要做成裹粉油炸鸡排、炸鸡块、鸡柳条或鸡米花。",

          tableFinished: "画面主体是一份已经煎制完成的家常巴沙鱼排健康餐，放在普通家用餐盘中。鱼排表面有轻微金黄煎痕和自然鱼肉质感，分量合理，适宜 1–2 人食。不要做成裹粉油炸鱼排、炸鱼块或鱼柳条。",
          cutOrPickup: "画面主体是一块已经煎好的巴沙鱼排，被筷子、叉子或餐具轻轻夹起一小块，或者鱼排被自然切开，露出内部柔嫩、洁白、真实的鱼肉纹理。表面有轻微金黄煎痕，内部呈现自然鱼肉纤维和柔嫩质感。"

      },
      sideDishStrategies: {

        richDispersed: { name: "丰富但分散", desc: "背景中自然出现较丰富的健康餐备菜和烹饪痕迹，但这些食材应分散在台面、盘子、砧板或锅边的不同位置，不要集中堆成一大盘。成品型健康餐配菜可以出现 4–6 种，每种配菜数量克制，像真实家庭备菜时顺手放在旁边的小份量，而不是满满一盘展示型健康餐。配菜之间应有空间间隔，部分可以被遮挡、虚化或位于画面边缘，不需要全部清晰完整展示。" },
        tableFinished: { name: "餐桌成品型", desc: "餐桌上的配菜与辅料应体现真实家庭健康餐的上桌状态，以成品型健康餐配菜为主，同时保留少量真实烹饪痕迹，而不是只有单一固定摆盘。主菜旁自然搭配 2–3 种成品型健康餐配菜，分量适中，摆放自然随意，不对称，不精致摆拍。" },
        cutContinuity: { name: "截面/夹起连续性", desc: "餐盘中可自然看到上一张图中的部分健康餐配菜，部分可被遮挡或位于画面边缘，不需要全部清晰展示。也可以少量保留 1–2 种烹饪型辅料痕迹，低调出现在盘边或主菜旁，保持同一顿健康餐的连续性。" }
      },
      productSideDishes: {
        steak: "牛排辅料可自然搭配：洋葱切片、煎制大蒜、迷迭香、百里香、黑胡椒、蘑菇片、芦笋、小番茄、彩椒条、西葫芦片。黄油小块谨慎使用，必须强调少量、克制。",
        chicken: "鸡排辅料可自然搭配：蒜片、洋葱切片、黑胡椒、蘑菇片、少量彩椒条、西葫芦片、芦笋、小番茄、少量柠檬片、迷迭香、百里香。迷迭香和百里香不要过强，否则容易偏西式摆盘。",
        fish: "鱼排辅料可自然搭配：柠檬角、蒜片、少量姜片、黑胡椒、洋葱切片、欧芹或少量香草、西葫芦片、芦笋、小番茄、彩椒条、蘑菇片。鱼排辅料和牛排/鸡排差异明显，应保留产品特异性。"
      },
      packagingStrategies: {
        none: { name: "无包装", desc: "不出现产品包装。画面只保留真实家庭厨房或餐桌场景、主菜、配菜和少量日常用品。" },
        steakFlatBox: { name: "牛排盒装包装，平放", desc: "画面中允许自然出现产品包装，但包装只是厨房台面上的辅助道具，不是商品展示。包装必须平放在台面上，不能立着放，也不要斜靠墙面。包装应放在画面后侧或边缘位置，距离主体较远，处于自然背景虚化中，只呈现模糊的包装轮廓、黑色盒体、局部色块、开封痕迹或塑料托盘感，不显示可读文字。包装可以被盘子、配菜、锅具、砧板或台面边缘自然遮挡一部分。包装不在画面中心，不抢走正在烹饪或备菜的食物主体。" },
        chickenSoftBag: { name: "鸡排袋装包装，平放", desc: "画面中允许自然出现产品包装，但包装只是厨房台面上的辅助道具，不是商品展示。包装为已开封的袋装鸡排包装，应表现为软袋、包装袋、真空袋或自立袋一类的食品包装形式，而不是盒装托盘。包装必须平放在台面上，不能立着放，也不要斜靠墙面。包装应放在画面后侧或边缘位置，距离主体较远，处于自然背景虚化中，只呈现模糊的包装轮廓、配色和袋装质感，不显示可读文字。包装可以略微压扁、自然折叠、软塌、有开封痕迹，也可以被盘子、配菜、锅具、砧板或台面边缘自然遮挡一部分。只需要保留包装袋的大致外轮廓、局部橙色或暖色调色块、开封痕迹、袋装材质感和生活化存在感。" },
        noReadableText: { name: "包装文字规避", desc: "不要清晰展示品牌名、卖点文案、规格或任何小字。包装上的文字应自然不可读，避免出现清晰但错误的中文、伪文字、乱码或变形 logo。包装不可以正面朝向镜头，不要完整展示包装正面，也不要出现任何清晰可读的包装文字。包装上的文字区域应朝下、背向镜头、被折叠、被遮挡、反光过曝或处于背景虚化中。只需要让人感觉旁边有一个产品包装存在，不要看清文案、规格或任何小字。" }
      },
      negativeConstraints: {
        global: "不要广告图，不要电商主图，不要商业摄影风格，不要杂志感，不要精致摆盘，不要棚拍布光，不要文字、水印、logo、界面元素。不要脏乱厨房，不要油腻厨房，不要样板间感。不要把配菜集中堆成满满一盘，不要商业健康餐拼盘感。",
        oilControl: "不要重油，不要大量黄油，不要明显油汪汪的锅底，不要厚重酱汁，不要过度油润，不要浸在油里的状态。",
        packaging: "不要包装立着放，不要包装正面清晰展示，不要可读包装文字，不要乱码，不要伪中文，不要变形 logo，不要商品展示式包装露出。"
      }
    };

    const PRODUCT_SUITES = {
      steak: { name: "牛排四图套组", emoji: "🥩", product: "steak", scenes: ["kitchenCooking", "rawPrep", "tableFinished", "cutOrPickup"], defaultScene: "kitchenCooking", defaultSideDish: "richDispersed", defaultPackaging: ["none"] },
      chicken: { name: "鸡排四图套组", emoji: "🍗", product: "chicken", scenes: ["kitchenCooking", "rawPrep", "tableFinished", "cutOrPickup"], defaultScene: "kitchenCooking", defaultSideDish: "richDispersed", defaultPackaging: ["none"] },
      fish: { name: "鱼排四图套组", emoji: "🐟", product: "fish", scenes: ["kitchenCooking", "rawPrep", "tableFinished", "cutOrPickup"], defaultScene: "kitchenCooking", defaultSideDish: "richDispersed", defaultPackaging: ["none"] }
    };

    const SCENE_ORDER = ["kitchenCooking", "rawPrep", "tableFinished", "cutOrPickup"];
    const SCENE_LABELS = { kitchenCooking: "01 厨房煎制", rawPrep: "02 生鲜备菜", tableFinished: "03 餐桌成品", cutOrPickup: "04 截面/夹起" };

    const DEFAULT_STATE = { product: "steak", scene: "kitchenCooking", sideDish: "richDispersed", packaging: new Set(["none"]) };
    const state = { product: DEFAULT_STATE.product, scene: DEFAULT_STATE.scene, sideDish: DEFAULT_STATE.sideDish, packaging: new Set(DEFAULT_STATE.packaging) };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const suiteGrid = $("#suite-grid");
    const sceneSelector = $("#scene-selector");
    const packagingSelector = $("#packaging-selector");
    const sidesSelector = $("#sides-selector");
    const packagingHint = $("#packaging-hint");
    const moduleGrid = $("#module-grid");
    const promptPreview = $("#prompt-preview");
    const charCount = $("#char-count");
    const compositionSummary = $("#composition-summary");
    const btnCopy = $("#btn-copy");
    const btnReset = $("#btn-reset");
    const toastEl = $("#toast");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function updateCharCount(text) {
      charCount.textContent = `${text.length} 字符`;
    }

    function renderSuiteCards() {
      suiteGrid.innerHTML = Object.entries(PRODUCT_SUITES).map(([id, suite]) => {
        const isActive = state.product === id;
        const sceneChips = suite.scenes.map(s => `<span class="suite-scene-chip">${SCENE_LABELS[s] || s}</span>`).join("");
        return `<div class="suite-card ${isActive ? "is-active" : ""}" data-suite="${id}">
          <div class="suite-name">${escapeHtml(suite.name)}</div>
          <div class="suite-scenes">${sceneChips}</div>
          <span class="suite-active-badge">当前</span>
        </div>`;
      }).join("");

      suiteGrid.querySelectorAll("[data-suite]").forEach((card) => {
        card.addEventListener("click", () => {
          const id = card.getAttribute("data-suite");
          const suite = PRODUCT_SUITES[id];
          if (!suite) return;
          applySuite(suite);
        });
      });
    }

    function applySuite(suite) {
      state.product = suite.product;
      state.scene = suite.defaultScene;
      state.sideDish = suite.defaultSideDish;
      state.packaging = new Set(suite.defaultPackaging);

      renderSuiteCards();
      renderSceneSelector();
      renderPackagingSelector();
      renderSidesSelector();
      updatePackagingHint();
      onSelectionChange();
      showToast(`已切换至 ${suite.name}`);
    }

    function renderSceneSelector() {
      const scenes = FOOD_MODULES.scenes;
      sceneSelector.innerHTML = SCENE_ORDER.map(id => {
        const s = scenes[id];
        if (!s) return "";
        return `<button type="button" class="chip ${state.scene === id ? "selected" : ""}" data-scene="${id}">
          <span class="chip-check">✓</span>
          ${escapeHtml(s.name)}
        </button>`;
      }).join("");

      sceneSelector.querySelectorAll("[data-scene]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-scene");
          state.scene = state.scene === id ? null : id;
          renderSceneSelector();
          onSelectionChange();
        });
      });
    }

    function renderPackagingSelector() {
      const items = FOOD_MODULES.packagingStrategies;
      packagingSelector.innerHTML = Object.entries(items).map(([id, p]) =>
        `<button type="button" class="chip multi ${state.packaging.has(id) ? "selected" : ""}" data-packaging="${id}">
          <span class="chip-check">✓</span>
          ${escapeHtml(p.name)}
        </button>`
      ).join("");

      packagingSelector.querySelectorAll("[data-packaging]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-packaging");
          if (state.packaging.has(id)) {
            state.packaging.delete(id);
          } else {
            state.packaging.add(id);
          }
          renderPackagingSelector();
          updatePackagingHint();
          onSelectionChange();
        });
      });
    }

    function renderSidesSelector() {
      const items = FOOD_MODULES.sideDishStrategies;
      sidesSelector.innerHTML = Object.entries(items).map(([id, s]) =>
        `<button type="button" class="chip multi ${state.sideDish === id ? "selected" : ""}" data-sides="${id}">
          <span class="chip-check">✓</span>
          ${escapeHtml(s.name)}
        </button>`
      ).join("");

      sidesSelector.querySelectorAll("[data-sides]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-sides");
          state.sideDish = state.sideDish === id ? null : id;
          renderSidesSelector();
          onSelectionChange();
        });
      });
    }

    function updatePackagingHint() {
      const isFish = state.product === "fish";
      const hasNonNonePackaging = [...state.packaging].some(id => id !== "none");
      if (isFish && hasNonNonePackaging) {
        packagingHint.classList.add("visible");
      } else {
        packagingHint.classList.remove("visible");
      }
    }

    function getLayerTexts() {
      if (!state.product || !state.scene) return null;

      const prod = FOOD_MODULES.products[state.product];
      const scn = FOOD_MODULES.scenes[state.scene];
      const override = FOOD_MODULES.productSceneOverrides[state.product][state.scene];
      const sideDishText = state.sideDish
        ? FOOD_MODULES.sideDishStrategies[state.sideDish].desc
        : "（未选择配菜策略）";
      const productSideDishText = FOOD_MODULES.productSideDishes[state.product];

      const hasPackaging = state.packaging.size > 0 && !(state.packaging.size === 1 && state.packaging.has("none"));
      let packagingTexts = [];
      if (hasPackaging) {
        state.packaging.forEach(id => {
          if (id !== "none" && FOOD_MODULES.packagingStrategies[id]) {
            packagingTexts.push(FOOD_MODULES.packagingStrategies[id].desc);
          }
        });
      }
      const packagingText = packagingTexts.length > 0
        ? packagingTexts.join("；")
        : "不出现产品包装。画面只保留真实家庭厨房或餐桌场景、主菜、配菜和少量日常用品。";

      const neg = FOOD_MODULES.negativeConstraints;
      let negativeParts = [neg.global, neg.oilControl, prod.negatives];
      if (hasPackaging) {
        negativeParts.push(neg.packaging);
      }
      const negativeText = negativeParts.join("\n");

      const layers = [];
      layers.push({ name: "真实生活感底色层", text: FOOD_MODULES.globalBase.realism, tag: "通用", defaultOpen: false });
      layers.push({ name: "场景层", text: scn.desc, tag: "场景", defaultOpen: true });
      layers.push({ name: "产品主体识别层", text: prod.identity, tag: "产品", defaultOpen: true });
      layers.push({ name: "产品×场景特化层", text: override, tag: "产品", defaultOpen: true });
      layers.push({ name: "配菜策略层", text: sideDishText, tag: "配菜", defaultOpen: false });
      layers.push({ name: "产品专属辅料层", text: productSideDishText, tag: "配菜", defaultOpen: false });
      layers.push({ name: "包装植入层", text: packagingText, tag: "包装", defaultOpen: false });
      layers.push({ name: "负向约束层", text: negativeText, tag: "负向", defaultOpen: false });
      return layers;
    }

    function assemblePrompt() {
      const layers = getLayerTexts();
      if (!layers) {
        promptPreview.value = "";
        updateCharCount("");
        renderModuleCards(null);
        renderCompositionSummary();
        return;
      }
      const fullPrompt = layers.map(l => l.text).filter(t => t).join("\n\n");
      promptPreview.value = fullPrompt;
      updateCharCount(fullPrompt);
      renderModuleCards(layers);
      renderCompositionSummary();
    }

    function renderCompositionSummary() {
      if (!state.product || !state.scene) {
        compositionSummary.textContent = "请先选择产品套组和场景。";
        return;
      }
      const prod = FOOD_MODULES.products[state.product];
      const scn = FOOD_MODULES.scenes[state.scene];
      const sideDishName = state.sideDish ? FOOD_MODULES.sideDishStrategies[state.sideDish].name : "None";
      const packagingNames = [...state.packaging]
        .map(id => FOOD_MODULES.packagingStrategies[id]?.name || id)
        .join(" + ");
      compositionSummary.innerHTML =
        `<strong>${prod.name}</strong> ｜ ${scn.name} ｜ ${packagingNames} ｜ ${sideDishName}`;
    }

    function renderModuleCards(layers) {
      if (!layers || layers.length === 0) {
        moduleGrid.innerHTML = `<div style="text-align:center;padding:28px 16px;color:var(--text-muted);background:var(--surface);border-radius:var(--radius);font-size:0.85rem;">选择产品套组和场景后查看模块。</div>`;
        return;
      }
      moduleGrid.innerHTML = layers.map((layer, i) => {
        const isOpen = layer.defaultOpen;
        return `<div class="module-card">
          <div class="module-card-header ${isOpen ? "open" : ""}" data-mc-index="${i}">
            <span class="mc-toggle">▶</span>
            <span class="mc-label">${escapeHtml(layer.name)}</span>
            <span class="mc-tag">${layer.tag || ""}</span>
          </div>
          <div class="module-card-body ${isOpen ? "" : "collapsed"}">${escapeHtml(layer.text)}</div>
        </div>`;
      }).join("");

      moduleGrid.querySelectorAll("[data-mc-index]").forEach((header) => {
        header.addEventListener("click", () => {
          const idx = header.getAttribute("data-mc-index");
          const body = moduleGrid.querySelectorAll(".module-card-body")[idx];
          const isOpen = header.classList.toggle("open");
          body.classList.toggle("collapsed");
        });
      });
    }

    function onSelectionChange() {
      assemblePrompt();
    }

    async function copyPrompt() {
      const text = promptPreview.value.trim();
      if (!text) {
        showToast("请先选择产品套组和场景。");
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      btnCopy.textContent = "已复制";
      btnCopy.classList.add("copied");
      setTimeout(() => {
        btnCopy.textContent = "复制";
        btnCopy.classList.remove("copied");
      }, 1500);
      showToast("已复制到剪贴板");
    }

    function resetToDefault() {
      state.product = DEFAULT_STATE.product;
      state.scene = DEFAULT_STATE.scene;
      state.sideDish = DEFAULT_STATE.sideDish;
      state.packaging = new Set(DEFAULT_STATE.packaging);

      renderSuiteCards();
      renderSceneSelector();
      renderPackagingSelector();
      renderSidesSelector();
      updatePackagingHint();
      onSelectionChange();
      showToast("已重置为默认配置（牛排 · 厨房煎制）");
    }

    function init() {
      renderSuiteCards();
      renderSceneSelector();
      renderPackagingSelector();
      renderSidesSelector();
      updatePackagingHint();
      assemblePrompt();
      btnCopy.addEventListener("click", copyPrompt);
      btnReset.addEventListener("click", resetToDefault);
    }

    init();
  </script>
</body>
</html>
